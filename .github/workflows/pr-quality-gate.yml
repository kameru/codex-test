name: pr-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static quality checks
        run: scripts/ci/quality_gate.sh

      - name: Validate PR body sections for automation-target PRs
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || "";
            const labels = (pr.labels || []).map(label => label.name);
            const strictMode = labels.includes("automerge") || /^chore\(ai\):/i.test(pr.title || "");

            if (!strictMode) {
              core.notice("Skipping strict PR template validation for non-automerge/non-AI PR.");
              return;
            }

            const required = ["## Summary", "## Traceability"];
            const missing = required.filter(section => !body.includes(section));

            if (missing.length > 0) {
              core.setFailed(`PR body is missing required sections for strict mode: ${missing.join(', ')}`);
            }
