name: pr-quality-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static quality checks
        run: scripts/ci/quality_gate.sh

      - name: Ensure PR body contains rollout section
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const required = ["## Summary", "## Traceability"];
            const missing = required.filter(section => !body.includes(section));
            if (missing.length > 0) {
              core.setFailed(`PR body is missing required sections: ${missing.join(', ')}`);
            }
