name: Auto Merge (Policy)

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    name: Enable auto-merge when policy is satisfied
    if: contains(github.event.pull_request.labels.*.name, 'automerge') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Require at least one approval
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            const latestByUser = new Map();
            for (const review of reviews) latestByUser.set(review.user.login, review.state);

            const approvals = [...latestByUser.values()].filter((state) => state === 'APPROVED').length;
            const changesRequested = [...latestByUser.values()].some((state) => state === 'CHANGES_REQUESTED');

            if (changesRequested) core.setFailed('Cannot enable auto-merge: changes requested present.');
            if (approvals < 1) core.setFailed('Cannot enable auto-merge: at least one approval required.');

      - name: Enable auto-merge (squash)
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
