name: AI Review Assistant

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Post AI review checklist
    runs-on: ubuntu-latest
    steps:
      - name: Post review checklist comment
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changedFiles = pr.changed_files;
            const body = [
              '🤖 AI Review Checklist (자동 생성)',
              '',
              `- PR: #${pr.number}`,
              `- Title: ${pr.title}`,
              `- Changed files: ${changedFiles}`,
              '',
              '아래 항목을 확인하세요:',
              '- [ ] 테스트/린트 결과 확인',
              '- [ ] 민감 경로(인증/결제/권한/인프라) 변경 여부 확인',
              '- [ ] 변경 범위 대비 테스트 커버리지 확인',
              '- [ ] 롤백 계획 또는 대응 절차 확인'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });

      - name: Manual dispatch note
        if: github.event_name == 'workflow_dispatch'
        run: echo "Run from pull_request event to post review checklist."
