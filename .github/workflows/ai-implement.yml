name: AI Implement Assistant

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task:
        description: "Implementation instruction for AI assistant"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  propose-change:
    name: Generate AI proposal branch and PR
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/ai-implement'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve task text
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${{ github.event.inputs.task }}"
          else
            TASK="${{ github.event.comment.body }}"
            TASK="${TASK#/ai-implement }"
          fi

          if [ -z "$TASK" ]; then
            echo "Task text is empty. Provide '/ai-implement <task>' or workflow input." >&2
            exit 1
          fi

          {
            echo "task<<EOF"
            echo "$TASK"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create implementation request artifact
        run: |
          mkdir -p ai-requests
          FILE="ai-requests/request-${{ github.run_id }}.md"
          {
            echo "# AI Implementation Request"
            echo
            echo "- Triggered by: @${{ github.actor }}"
            echo "- Source event: ${{ github.event_name }}"
            echo "- Run ID: ${{ github.run_id }}"
            echo
            echo "## Requested task"
            echo
            echo "${{ steps.task.outputs.task }}"
          } > "$FILE"
          echo "Created $FILE"

      - name: Open pull request with generated request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(ai): capture implementation request ${{ github.run_id }}"
          title: "chore(ai): implementation request ${{ github.run_id }}"
          body: |
            ## AI implementation request
            - Triggered by: @${{ github.actor }}
            - Source event: `${{ github.event_name }}`

            ### Task
            ${{ steps.task.outputs.task }}

            > This PR is an automated handoff artifact. Replace/update files with actual implementation and keep CI green.
          branch: ai/request-${{ github.run_id }}
          labels: ai,needs-review

      - name: Report result to issue or PR thread
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const prUrl = `${{ steps.cpr.outputs.pull-request-url }}`;
            const body = prUrl
              ? `✅ AI proposal PR created: ${prUrl}`
              : 'ℹ️ No PR was created (likely no file changes).';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
