name: auto-merge

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-or-merge:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - name: Validate merge conditions and enable automerge
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map(l => l.name);
            if (!labels.includes('automerge')) {
              core.info('automerge label not found. skip');
              return;
            }
            if (labels.includes('risk:high')) {
              core.setFailed('risk:high PR cannot be auto-merged');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const approvals = reviews.filter(r => r.state === 'APPROVED').length;
            if (approvals < 1) {
              core.setFailed('At least one approval is required for automerge');
              return;
            }

            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: SQUASH}) {
                    clientMutationId
                  }
                }`,
                { pullRequestId: pr.node_id }
              );
              core.info('Auto-merge enabled. GitHub will merge when required checks pass.');
            } catch (err) {
              core.setFailed(`Unable to enable auto-merge: ${err.message}`);
            }
